name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The hosting tests start a real node, which needs a port mapper. Without one they skip, so
      # install Erlang to make sure they actually run somewhere.
      - uses: erlef/setup-beam@v1
        if: runner.os == 'Linux'
        with:
          otp-version: '27'
      - run: epmd -daemon
        if: runner.os == 'Linux'
      # Warnings fail here rather than only annotating. An analyzer warning is worth looking at
      # even when the conclusion is to suppress it with a reason.
      - run: dotnet build --nologo -warnaserror
      - run: dotnet test --nologo

  aot:
    # The generated serializer claims to be AOT-safe; this is where that claim is checked rather
    # than asserted. The publish must also be free of trim and AOT warnings.
    name: nativeaot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: test/run_aot_probe.sh

  interop:
    # The point of this library is that a real BEAM node cannot tell the difference,
    # so the interop suite runs against every OTP release we claim to support.
    name: interop / OTP ${{ matrix.otp }} + Elixir ${{ matrix.elixir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '26'
            elixir: '1.17'
          - otp: '27'
            elixir: '1.18'
          - otp: '28'
            elixir: '1.19'
          - otp: '29'
            elixir: '1.20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - run: test/run_integration.sh
      - run: test/run_tls_integration.sh
